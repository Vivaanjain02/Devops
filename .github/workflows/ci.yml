name: CI Pipeline – DevOps Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # =========================
  # JOB 1: UNIT TESTING
  # =========================
  unit-testing:
    name: unit-testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Basic HTML validation
        run: |
          echo "Running basic checks"
          ls -la
          test -f index.html

  # =========================
  # JOB 2: SECURITY GATE
  # =========================
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: SonarQube Code Quality Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Vivaanjain02_Devops
            -Dsonar.organization=vivaanjain02
            -Dsonar.sources=.

  # =========================
  # JOB 3: CONTAINERIZATION
  # =========================
  containerization:
    name: containerization
    runs-on: ubuntu-latest
    needs: security-gate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-static-app .

      - name: Run container and smoke test
        run: |
          docker run -d -p 8080:80 --name test-app devops-static-app
          sleep 5
          curl -f http://localhost:8080

      - name: Monitoring Ready
        run: |
          echo "Application ready for Prometheus & Grafana"
