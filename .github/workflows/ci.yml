name: CI Pipeline - DevOps Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # STAGE 1: CHECKOUT CODE
      # =========================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =========================
      # STAGE 2: SONARQUBE SCAN
      # =========================
      - name: SonarQube Code Quality Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Vivaanjain02_Devops
            -Dsonar.organization=vivaanjain02
            -Dsonar.sources=.

      # =========================
      # STAGE 3: DOCKER BUILD
      # =========================
      - name: Build Docker image
        run: |
          docker build -t devops-static-app .

      # =========================
      # STAGE 4: RUN + TEST
      # =========================
      - name: Run container and smoke test
        run: |
          docker run -d -p 8080:80 --name test-app devops-static-app
          sleep 5
          curl -f http://localhost:8080

      # =========================
      # STAGE 5: MONITORING READY
      # =========================
      - name: Monitoring Ready
        run: |
          echo "Application is ready for Prometheus & Grafana monitoring"
